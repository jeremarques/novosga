services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novosga
      POSTGRES_USER: novosga
      POSTGRES_PASSWORD: novosga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novosga -d novosga"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - novosga_local_database:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "localredis"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localredis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  novosga:
    build: .
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: local-dev-secret-change-me
      APP_LANGUAGE: pt_BR
      DATABASE_URL: postgresql://novosga:novosga@database:5432/novosga?serverVersion=16&charset=utf8
      MERCURE_URL: http://127.0.0.1:8080/.well-known/mercure
      MERCURE_PUBLIC_URL: /.well-known/mercure
      MERCURE_PUBLISHER_JWT_KEY: local-mercure-secret-change-me
      MERCURE_JWT_SECRET: local-mercure-secret-change-me
      REDIS_URL: tcp://redis:6379
      REDIS_PASSWORD: localredis
      NOVOSGA_ADMIN_USERNAME: admin
      NOVOSGA_ADMIN_PASSWORD: admin123
      NOVOSGA_ADMIN_FIRSTNAME: Admin
      NOVOSGA_ADMIN_LASTNAME: Local
      NOVOSGA_UNITY_NAME: Unidade Local
      NOVOSGA_UNITY_DESCRIPTION: LOCAL
      NOVOSGA_UNITY_TIMEZONE: America/Sao_Paulo
      NOVOSGA_NOPRIORITY_NAME: Normal
      NOVOSGA_NOPRIORITY_DESCRIPTION: Sem prioridade
      NOVOSGA_PRIORITY_NAME: Prioridade
      NOVOSGA_PRIORITY_DESCRIPTION: Atendimento prioritario
      NOVOSGA_PLACE_NAME: Guiche

volumes:
  novosga_local_database: