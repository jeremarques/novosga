services:
  novosga:
    build: .
    restart: always
    ports:
      - "80:8080"
    environment:
      APP_ENV: ${APP_ENV}
      # database connection
      DATABASE_URL: ${DATABASE_URL}
      APP_LANGUAGE: ${APP_LANGUAGE}
      # mesma chave usada pelo Mercure embutido no FrankenPHP/Caddy
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
      MERCURE_JWT_SECRET: ${MERCURE_PUBLISHER_JWT_KEY}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}